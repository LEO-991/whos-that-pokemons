<div class="auth-page">
  <div class="auth-card card">
    <div class="auth-header">
      <div class="pokeball">
        <img src="ultraBall.ico" width="48" height="48" />
      </div>
      <h2>Welcome Back, Trainer!</h2>
      <p>Login to continue your journey</p>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" type="text" [(ngModel)]="username" name="username" placeholder="Enter your username" autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="Enter your password" autocomplete="current-password" />
      </div>

      @if (error) {
        <p class="error-msg">⚠️ {{ error }}</p>
      }

      <button type="submit" class="btn-primary btn-full" [disabled]="loading">
        {{ loading ? 'Logging in...' : '▶ Login' }}
      </button>
    </form>


    <p class="admin-footer">
      Admin Panel: admin / admin123
    </p>
    <p class="auth-footer">
      No account yet? <a routerLink="/register">Register here</a>
    </p>
  </div>
</div>
